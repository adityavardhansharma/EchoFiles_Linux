<!doctype html>
<html>
<head><meta charset="utf-8"><title>ProgressBar</title></head>
<body>
<div id="root"></div>
<script>
(function(){
var E = window.EchoConnect, h = React.createElement;
function App(){
return h("div", {className:"ec-pad", style:{maxWidth:380}}, h(E.ProgressBar, {value:62}), h(E.ProgressBar, {value:100, done:true}), h(E.ProgressBar, null));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
</body>
</html>

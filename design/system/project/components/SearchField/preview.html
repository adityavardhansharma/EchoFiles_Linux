<!doctype html>
<html>
<head><meta charset="utf-8"><title>SearchField</title></head>
<body>
<div id="root"></div>
<script>
(function(){
var E = window.Echo, h = React.createElement;
function App(){
return h("div", {className:"ef ef-row-flex"},
  h(E.SearchField, {id:"s1"}),
  h(E.SearchField, {id:"s2", defaultValue:"invoice", scope:"in AVS (D:)"}));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
</body>
</html>

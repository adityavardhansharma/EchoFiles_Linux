<head><meta charset="utf-8"><title>SystemNotification</title></head>
<body>
<div id="root"></div>
<script>
(function(){
var E = window.EchoConnect, h = React.createElement;
function App(){
return h("div", {className:"ec-pad", style:{maxWidth:380, background:"var(--bg-deep)"}}, h(E.SystemNotification, null));
}

})();
</script>

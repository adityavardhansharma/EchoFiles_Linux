<!doctype html>
<html>
<head><meta charset="utf-8"><title>SegmentedControl</title></head>
<body>
<div id="root"></div>
<script>
(function(){
var E = window.EchoConnect, h = React.createElement;
function App(){
return h("div", {className:"ec-pad", style:{maxWidth:380}}, h(E.SegmentedControl, {label:"Show", block:true, options:[{value:"all",text:"All"},{value:"to",text:"To laptop"},{value:"from",text:"From laptop"}]}),
  h(E.SegmentedControl, {label:"Theme", value:"laptop", options:[{value:"laptop",text:"Match laptop"},{value:"system",text:"Phone"}]}));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
</body>
</html>

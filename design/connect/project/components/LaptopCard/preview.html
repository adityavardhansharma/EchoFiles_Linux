<!-- @dsCard group="Connect" height=470 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>LaptopCard</title></head>
<body>
<div id="root"></div>
<script>
(function(){
var E = window.EchoConnect, h = React.createElement;
function App(){
var st = React.useState("connected");
return h("div", {className:"ec-pad", style:{maxWidth:380}}, h(E.SegmentedControl, {label:"State", value:st[0], onChange:st[1], options:[{value:"connected",text:"Connected"},{value:"locked",text:"Locked"},{value:"away",text:"Not nearby"}]}),
  h(E.LaptopCard, {key:st[0], state:st[0] === "away" ? "away" : "connected", locked:st[0] === "locked"}));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
</body>
</html>

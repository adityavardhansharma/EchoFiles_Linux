<!doctype html>
<html>
<head><meta charset="utf-8"><title>ClipModeCard</title></head>
<body>
<div id="root"></div>
<script>
(function(){
var E = window.EchoConnect, h = React.createElement;
function App(){
return h("div", {className:"ec-pad", style:{maxWidth:380}}, h(E.ClipModeCard, {mode:"auto"}), h(E.ClipModeCard, {mode:"paused"}), h(E.ClipModeCard, {mode:"manual"}));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
</body>
</html>

<!doctype html>
<html>
<head><meta charset="utf-8"><title>Switch</title></head>
<body>
<div id="root"></div>
<script>
(function(){
var E = window.EchoConnect, h = React.createElement;
function App(){
return h("div", {className:"ec-pad", style:{maxWidth:380}}, h(E.ListGroup, null,
  h(E.ListRow, {icon:"bell", title:"Notifications", sub:"Shown on the laptop", trailing:h(E.Switch, {defaultChecked:true, label:"Notifications"})}),
  h(E.ListRow, {icon:"message", title:"Messages", sub:"Read and send texts", trailing:h(E.Switch, {label:"Messages"})})));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
</body>
</html>

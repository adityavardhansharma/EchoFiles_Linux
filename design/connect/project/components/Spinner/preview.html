<!doctype html>
<html>
<head><meta charset="utf-8"><title>Spinner</title></head>
<body>
<div id="root"></div>
<script>
(function(){
var E = window.EchoConnect, h = React.createElement;
function App(){
return h("div", {className:"ec-pad"}, h("div", {className:"ec-row-flex"}, h(E.Spinner, null), h(E.Spinner, {large:true}), h("span", {className:"ec-wait"}, h(E.Spinner, null), "Waiting for Aditya's laptop…")));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
</body>
</html>

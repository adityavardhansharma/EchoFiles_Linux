[package]
name = "echofiles-index"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "ef_index"

[dependencies]
rustix = { workspace = true, features = ["net", "process", "mm", "system"] }
rayon.workspace = true
memchr = "2.8"
ef-config.workspace = true
serde_json = "1"
regex = { version = "1.12", default-features = false, features = ["std", "perf", "unicode"] }
regex-syntax = { version = "0.8", default-features = false, features = ["std", "unicode"] }

[dev-dependencies]
unicode-normalization = "0.1.25"
tempfile = "3"
divan.workspace = true
mimalloc.workspace = true

[[bin]]
name = "ef"
path = "src/bin/ef/main.rs"

[[bench]]
name = "search"
harness = false

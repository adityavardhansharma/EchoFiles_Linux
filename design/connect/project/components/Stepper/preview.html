<!doctype html>
<html>
<head><meta charset="utf-8"><title>Stepper</title></head>
<body>
<div id="root"></div>
<script>
(function(){
var E = window.EchoConnect, h = React.createElement;
function App(){
return h("div", {className:"ec-pad", style:{maxWidth:380}}, h(E.Stepper, {current:1, count:5, label:"Scan"}), h(E.Stepper, {current:4, count:5, label:"Clipboard"}));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
</body>
</html>

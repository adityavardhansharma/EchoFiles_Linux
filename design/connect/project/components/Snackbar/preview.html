<!doctype html>
<html>
<head><meta charset="utf-8"><title>Snackbar</title></head>
<body>
<div id="root"></div>
<script>
(function(){
var E = window.EchoConnect, h = React.createElement;
function App(){
return h("div", {className:"ec-pad", style:{maxWidth:380}}, h(E.Snackbar, {icon:"check", tone:"success"}, "Sent to Aditya's laptop"), h(E.Snackbar, {icon:"clipboard", action:"Undo"}, "Clipboard sent"), h(E.Snackbar, {icon:"error", tone:"danger", action:"Retry"}, "Couldn't reach the laptop"));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
</body>
</html>

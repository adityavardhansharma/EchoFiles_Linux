<html>
<head><meta charset="utf-8"><title>Skeleton</title></head>
<body>
<div id="root"></div>
<script>
(function(){
var E = window.Echo, h = React.createElement;
function App(){
return h("div", {className:"ef", style:{paddingTop:8}}, h(E.Skeleton, {rows:6}));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>

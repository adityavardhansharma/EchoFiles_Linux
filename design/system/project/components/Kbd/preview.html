<!doctype html>
<html>
<head><meta charset="utf-8"><title>Kbd</title></head>
<body>
<div id="root"></div>
<script>
(function(){
var E = window.Echo, h = React.createElement;
function App(){
return h("div", {className:"ef ef-row-flex"},
  h(E.Kbd, {keys:["Ctrl","L"]}), h(E.Kbd, {keys:["F2"]}), h(E.Kbd, {keys:["Shift","Del"]}), h(E.Kbd, {keys:["Space"]}), h(E.Kbd, {keys:["Ctrl","K"]}));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
</body>
</html>

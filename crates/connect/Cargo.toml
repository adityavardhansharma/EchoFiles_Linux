[package]
name = "echoconnect-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "EchoConnect's Rust core for Android: the KDE Connect protocol (phone role) exposed to Kotlin through UniFFI"

[lib]
name = "echoconnect"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bindgen.rs"

[dependencies]
ef-phone.workspace = true
getrandom = "0.3"
russh = "0.63.3"
russh-sftp = "3.0.1"
serde_json = "1"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "fs", "io-util", "sync"] }
uniffi = { version = "0.32.2", features = ["cli"] }
